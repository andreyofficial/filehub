<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FileHub — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-body: #0d0618;
      --card: #1a0f2e;
      --border: rgba(255, 255, 255, 0.08);
      --text: #fff;
      --muted: #b8a9c9;
      --muted2: #7d6f92;
      --radius: 18px;
      --font: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg-body);
      background-image:
        radial-gradient(ellipse 90% 55% at 50% -15%, rgba(124, 58, 237, 0.45), transparent 55%),
        linear-gradient(180deg, #15081f 0%, var(--bg-body) 40%, #0a0410 100%);
      padding: 2rem 1rem;
    }
    .wrap { max-width: 440px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; line-height: 1.55; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .tabs button {
      flex: 1;
      padding: 0.6rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .tabs button.active {
      background: rgba(168, 85, 247, 0.25);
      color: #fff;
      border-color: rgba(168, 85, 247, 0.5);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.35rem;
    }
    label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.35rem; }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(11, 2, 19, 0.5);
      color: #fff;
      font-family: inherit;
      margin-bottom: 0.85rem;
    }
    input:focus { outline: none; border-color: rgba(168, 85, 247, 0.6); }
    .btn {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      background: linear-gradient(90deg, #f472b6, #a855f7);
      color: #fff;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .msg { padding: 0.75rem; border-radius: 10px; font-size: 0.88rem; margin-bottom: 1rem; display: none; }
    .msg.err { display: block; background: rgba(248,113,113,0.15); color: #fca5a5; }
    .msg.ok { display: block; background: rgba(0,200,83,0.15); color: #86efac; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>FileHub</h1>
    <p class="sub">Paid purchases use <strong>PayPal</strong> (what many large retailers use alongside cards). Sign in with email and password only — no card stored on this site.</p>

    <div class="tabs">
      <button type="button" id="tab-signup" class="active">Create account</button>
      <button type="button" id="tab-login">Sign in</button>
    </div>

    <div id="msg" class="msg" role="alert"></div>

    <div class="card">
      <form id="form-auth">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />

        <button type="submit" class="btn" id="btn-primary">Create account</button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const nextUrl = new URLSearchParams(location.search).get("next") || "website.html";
      if (localStorage.getItem("filehub_token")) {
        location.href = nextUrl;
        return;
      }

      const tabSignup = document.getElementById("tab-signup");
      const tabLogin = document.getElementById("tab-login");
      const form = document.getElementById("form-auth");
      const msg = document.getElementById("msg");
      const btnPrimary = document.getElementById("btn-primary");
      let mode = "signup";

      function showMsg(text, ok) {
        msg.textContent = text || "";
        msg.className = "msg " + (ok ? "ok" : "err");
        msg.style.display = text ? "block" : "none";
      }

      function setMode(m) {
        mode = m;
        tabSignup.classList.toggle("active", m === "signup");
        tabLogin.classList.toggle("active", m === "login");
        btnPrimary.textContent = m === "signup" ? "Create account" : "Sign in";
      }

      tabSignup.addEventListener("click", () => setMode("signup"));
      tabLogin.addEventListener("click", () => setMode("login"));

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        showMsg("", true);
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        btnPrimary.disabled = true;
        try {
          if (mode === "signup") {
            const r = await fetch("/api/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            const j = await r.json();
            if (!r.ok) throw new Error(j.error || "Register failed");
            localStorage.setItem("filehub_token", j.token);
            localStorage.setItem("filehub_user", JSON.stringify(j.user));
          } else {
            const r = await fetch("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            const j = await r.json();
            if (!r.ok) throw new Error(j.error || "Login failed");
            localStorage.setItem("filehub_token", j.token);
            localStorage.setItem("filehub_user", JSON.stringify(j.user));
          }
          location.href = nextUrl;
        } catch (err) {
          showMsg(err.message || "Something went wrong", false);
        } finally {
          btnPrimary.disabled = false;
        }
      });

      setMode("signup");
    })();
  </script>
</body>
</html>
